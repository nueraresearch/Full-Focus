<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#inner)" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  <!-- Focus Orbit Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="20" stroke-dasharray="40 20"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#38bdf8" stroke-width="16"/>
  <!-- Core Target -->
  <circle cx="256" cy="256" r="38" fill="#4f46e5"/>
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  <!-- Spark Indicator -->
  <circle cx="360" cy="170" r="16" fill="#38bdf8"/>
</svg>
